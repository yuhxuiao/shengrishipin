<!doctype html>
<html>
<head>

<style>

    src: url('fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');

  html, body {

<canvas id="out" width="1920" height="1080"></canvas>

<!-- 骨骼与运动学底层 (复用 v10) -->

<script src="src/v12/main.js"></script>

</html>
