<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>V8 物理分镜电影级引擎 (Route A)</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16/9; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script src="src/engine.js"></script>
<script src="src/camera.js"></script>
<script src="src/v8_engine.js"></script>
<script>
const canvas = document.getElementById('out');
const ctx = canvas.getContext('2d');
window.ready = false;

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = e => reject(new Error('Failed to load: ' + src));
    img.src = src;
  });
}

window.renderAt = function (t, type, q) {
  renderV8CinematicFrame(ctx, Math.max(0, Math.min(t, V8_TOTAL - 1e-3)));
  return canvas.toDataURL(type || 'image/jpeg', q ?? .94);
};

window.renderSheet = function (ts, cols, w) {
  const rows = Math.ceil(ts.length / cols);
  const h = w * 9 / 16;
  const sheet = document.createElement('canvas');
  sheet.width = cols * w; sheet.height = rows * h;
  const c2 = sheet.getContext('2d');
  const ms = [];
  ts.forEach((t, i) => {
    const s = Date.now();
    renderV8CinematicFrame(ctx, t);
    c2.drawImage(canvas, (i % cols) * w, ((i / cols) | 0) * h, w, h);
    ms.push(Date.now() - s);
  });
  return { url: sheet.toDataURL('image/jpeg', .9), ms };
};

(async () => {
  try {
    const [s02, s03, s04_dig, s04_lift] = await Promise.all([
      loadImg('../output/bananan/Blue_excavator_waving_and_winking_2K_20260925110701.jpg'),
      loadImg('../output/bananan/Excavator_stretching_arm_to_sky_2K_20260925110604.jpg'),
      loadImg('../output/bananan/Excavator_demonstrating_digging_\u2026_2K_20260925110557.jpg'),
      loadImg('../output/bananan/Excavator_scooping_purple_sand_2K_20260925110704.jpg'),
    ]);
    V8_ASSETS.s02 = s02;
    V8_ASSETS.s03 = s03;
    V8_ASSETS.s04_dig = s04_dig;
    V8_ASSETS.s04_lift = s04_lift;
    
    // 默认绘制第一帧
    renderV8CinematicFrame(ctx, 0);
    window.ready = true;
    console.log('V8 Cinematic Engine Ready!');
  } catch (err) {
    console.error('Failed to init V8:', err);
  }
})();
</script>
</body>
</html>
